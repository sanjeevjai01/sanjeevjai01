<svg xmlns="http://w3.org" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient & Glows -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="60%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#021526" />
    </linearGradient>
    
    <radialGradient id="ambientGlow" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Glassmorphic Card Styling -->
    <linearGradient id="glassBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.2" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .font-main { font-family: 'Inter', 'SF Pro', -apple-system, sans-serif; }
      .font-mono { font-family: 'Geist Mono', 'Fira Code', monospace; }
      
      .name-text { font-size: 42px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
      .name-accent { fill: #38bdf8; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.3)); }
      .title-text { font-size: 20px; font-weight: 500; fill: #e2e8f0; }
      .tagline-text { font-size: 13px; font-weight: 600; fill: #64748b; letter-spacing: 3px; }
      
      .code-ui { font-size: 12px; fill: #38bdf8; }
      .code-keyword { fill: #f472b6; }
      .code-string { fill: #34d399; }
      
      .card-label { font-size: 10px; font-weight: 700; fill: #38bdf8; letter-spacing: 1px; opacity: 0.8; }
      .card-val { font-size: 13px; font-weight: 400; fill: #cbd5e1; }
    </style>
  </defs>

  <!-- Deep Base Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#ambientGlow)" />

  <!-- Elegant Tech Grid Overlay -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.25">
    <path d="M 0,80 L 1200,80 M 0,160 L 1200,160 M 0,240 L 1200,240 M 0,320 L 1200,320" />
    <path d="M 150,0 L 150,400 M 300,0 L 300,400 M 450,0 L 450,400 M 600,0 L 600,400 M 750,0 L 750,400 M 900,0 L 900,400 M 1050,0 L 1050,400" />
  </g>

  <!-- LEFT SIDE: Apple-Style Minimal Workspace Window -->
  <g transform="translate(80, 75)">
    <!-- Window Container -->
    <rect width="360" height="210" rx="12" fill="url(#glassBar)" stroke="#334155" stroke-width="1.2" />
    
    <!-- Mac Window Control Dots -->
    <circle cx="20" cy="18" r="5" fill="#f87171" opacity="0.8" />
    <circle cx="36" cy="18" r="5" fill="#fbbf24" opacity="0.8" />
    <circle cx="52" cy="18" r="5" fill="#34d399" opacity="0.8" />
    <text x="76" y="22" class="font-mono code-ui" fill="#475569" font-size="11px">developer.json</text>
    
    <!-- Code Editor Content -->
    <g transform="translate(20, 55)" class="font-mono" font-size="13px">
      <text x="0" y="20"><tspan class="code-keyword">const</tspan> professional = {</text>
      <text x="20" y="45">identity: <tspan class="code-string">"Sanjeev Kumar Jaiswal"</tspan>,</text>
      <text x="20" y="70">status: <tspan class="code-string">"A Versatile Tech Fresher"</tspan>,</text>
      <text x="20" y="95">engine: [<tspan class="code-string">"Build"</tspan>, <tspan class="code-string">"Learn"</tspan>, <tspan class="code-string">"Grow"</tspan>],</text>
      <text x="20" y="120">readyToDeploy: <tspan fill="#facc15">true</tspan></text>
      <text x="0" y="145">};</text>
    </g>
  </g>

  <!-- Floating UI Elements & Code Symbols -->
  <g transform="translate(410, 50)" stroke="#38bdf8" stroke-width="1" opacity="0.4">
    <text x="0" y="20" class="font-mono" font-size="24px" fill="none">&lt;/&gt;</text>
  </g>
  <g transform="translate(60, 240)" stroke="#334155" stroke-width="1" opacity="0.3">
    <text x="0" y="20" class="font-mono" font-size="28px" fill="none">{ }</text>
  </g>

  <!-- RIGHT SIDE: Clean Hero Typography -->
  <g transform="translate(500, 115)" class="font-main">
    <!-- Main Name -->
    <text x="0" y="40" class="name-text">Sanjeev Kumar <tspan class="name-accent">Jaiswal</tspan></text>
    
    <!-- Main Subtitle -->
    <text x="0" y="82" class="title-text">
      <tspan fill="#38bdf8" class="font-mono" font-weight="700">&lt;/&gt;</tspan> A Versatile Tech Fresher
    </text>
    
    <!-- Secondary Tagline -->
    <text x="3" y="118" class="tagline-text">BUILD • LEARN • GROW</text>
  </g>

  <!-- BOTTOM: Premium Balanced Contact UI Bar -->
  <g transform="translate(80, 315)" class="font-main">
    <!-- Email Card -->
    <g transform="translate(0, 0)">
      <rect width="245" height="52" rx="8" fill="url(#glassBar)" stroke="#334155" stroke-width="1" />
      <text x="16" y="20" class="card-label">EMAIL 📧</text>
      <text x="16" y="38" class="card-val">sanjeevjai01@gmail.com</text>
    </g>

    <!-- Phone Card -->
    <g transform="translate(260, 0)">
      <rect width="195" height="52" rx="8" fill="url(#glassBar)" stroke="#334155" stroke-width="1" />
      <text x="16" y="20" class="card-label">PHONE 📱</text>
      <text x="16" y="38" class="card-val">+91 7481012471</text>
    </g>

    <!-- LinkedIn Card -->
    <g transform="translate(470, 0)">
      <rect width="320" height="52" rx="8" fill="url(#glassBar)" stroke="#334155" stroke-width="1" />
      <text x="16" y="20" class="card-label">LINKEDIN 🔗</text>
      <text x="16" y="38" class="card-val">sanjeev-kumar-jaiswal-362520371</text>
    </g>

    <!-- GitHub Card -->
    <g transform="translate(805, 0)">
      <rect width="235" height="52" rx="8" fill="url(#glassBar)" stroke="#334155" stroke-width="1" />
      <text x="16" y="20" class="card-label">GITHUB 💻</text>
      <text x="16" y="38" class="card-val">sanjeevjai01</text>
    </g>
  </g>
</svg>
